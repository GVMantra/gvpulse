<template>

    <lightning-card title="Time Log by User Story">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
                    <lightning-input type="date" label="Start Date" value={startDate} data-id="startDate"
                        onchange={handleStartDate}>
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
                    <lightning-input type="date" label="End Date" value={endDate} onchange={handleEndDate}>
                    </lightning-input>
                </div>


                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-align-bottom">
                    <lightning-button variant="brand" label="Refresh" onclick={loadData}>
                    </lightning-button>
                </div>

            </div>

        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium">
            </lightning-spinner>
        </template>

        <template if:true={hasRows}>

            <div class="table-container">

                <table class="tracker-table">

                    <thead>
                        <tr>

                            <th class="sticky-column resource-column">
                                User Story
                            </th>

                            <template for:each={headers} for:item="header">

                                <th key={header.key} class={header.className}>

                                    <div class="header-date">
                                        {header.label} {header.month}
                                    </div>

                                    <div class="header-day">
                                        {header.dayName}
                                    </div>

                                </th>

                            </template>

                            <th class="total-column">
                                Total
                            </th>

                        </tr>
                    </thead>

                    <tbody>

                        <template for:each={rows} for:item="row">

                            <tr key={row.key}>

                                <td class="sticky-column resource-column" title={row.issueSummary}>

                                    <span class="story-link">
                                        {row.issueKey}
                                    </span>

                                </td>

                                <template for:each={row.cells} for:item="cell">

                                    <td key={cell.key} class={cell.className} data-key={cell.key}
                                        onmouseenter={handleCellMouseEnter} onmouseleave={handleCellMouseLeave}>

                                        <div class="cell-inner">

                                            {cell.value}

                                            <template if:true={cell.showTooltip}>

                                                <div class="worklog-tooltip" style={cell.tooltipStyle}>

                                                    <template for:each={cell.entries} for:item="entry">

                                                        <div key={entry.key} class="worklog-entry">

                                                            <div class="entry-time">
                                                                {entry.displayTime}
                                                            </div>

                                                            <template if:true={entry.hasComment}>
                                                                <div class="entry-comment">
                                                                    {entry.comment}
                                                                </div>
                                                            </template>

                                                        </div>

                                                    </template>

                                                </div>

                                            </template>

                                        </div>

                                    </td>

                                </template>

                                <td class="total-column">

                                    {row.total}

                                </td>

                            </tr>

                        </template>

                    </tbody>

                    <tfoot>

                        <tr>

                            <td class="sticky-column resource-column footer-cell">

                                Total

                            </td>

                            <template for:each={footer} for:item="cell">

                                <td key={cell.key} class={cell.className}>

                                    {cell.value}

                                </td>

                            </template>

                            <td class="total-column footer-cell">

                                {grandTotal}

                            </td>

                        </tr>

                    </tfoot>

                </table>

            </div>

        </template>

    </lightning-card>

</template>
